# golangci-lint v2 config. binary version pinned in Makefile (GOLANGCI_VERSION)
# and in .github/workflows/go_fast_checks.yml; keep them in sync.
#
# Run with GOOS=js GOARCH=wasm so main.go (//go:build js && wasm) is included.
# Setting build-tags here instead causes stdlib goarch file collisions on
# native hosts, so we go through env vars at the call site.
version: "2"

formatters:
  enable:
    - gofmt
