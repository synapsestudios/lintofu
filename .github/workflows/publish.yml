name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  typescript_fast_checks:
    name: TypeScript Fast Checks
    uses: ./.github/workflows/typescript_fast_checks.yml

  go_fast_checks:
    name: Go Fast Checks
    uses: ./.github/workflows/go_fast_checks.yml

  publish:
    name: Build and Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [typescript_fast_checks, go_fast_checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: parser-go/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@synapsestudios'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Release Tag Matches Version
        run: bash scripts/verify-release-version.sh "$GITHUB_REF_NAME" "$(node -p "require('./package.json').version")"

      - name: Build
        run: npm run build

      - name: Verify Tarball Contains WASM Parser
        run: npm pack --dry-run 2>&1 | grep -q 'dist/parser/lintofu-parser.wasm'

      - name: Publish
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
