name: Go Fast Checks

on:
  workflow_call:

jobs:
  fast-checks:
    name: Format, Lint, and Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: parser-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: parser-go/go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          working-directory: parser-go
        env:
          GOOS: js
          GOARCH: wasm

      - name: Format Check
        run: make fmt-check

      - name: Build
        run: go build ./...

      - name: Run Unit Tests
        run: go test -count=1 ./parser/...
