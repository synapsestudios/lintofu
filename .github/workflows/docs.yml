name: Docs Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    # `pages: write` is needed only by the Configure Pages step's `enablement`
    # input. Scoped to this job rather than raised to the top level.
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Two pull requests each adding a rule are green in isolation and leave
      # the index stale once both land, so this has to run on main and not
      # only on pull requests.
      - name: Check Rule Index
        run: npm run docs:rules:check

      - name: Build Docs Site
        run: npm run docs:build

      # `enablement: true` turns Pages on if it is off, so the deploy needs no
      # out-of-band repository settings change. `base` is hardcoded in
      # docs/.vitepress/config.mts, so the base path this exports is unused;
      # enablement is the only reason the step is here.
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
