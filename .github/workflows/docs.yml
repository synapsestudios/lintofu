name: Docs Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Two pull requests each adding a rule are green in isolation and leave
      # the index stale once both land, so this has to run on main and not
      # only on pull requests.
      - name: Check Rule Index
        run: npm run docs:rules:check

      - name: Build Docs Site
        run: npm run docs:build

      # No actions/configure-pages step. Its two jobs are enabling Pages and
      # exporting a computed base path. Enabling it needs repository admin,
      # which GITHUB_TOKEN does not have even with `pages: write`, and `base`
      # is hardcoded in docs/.vitepress/config.mts. Pages is already enabled
      # with the "GitHub Actions" source, so deploy-pages needs nothing else.
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
