name: Pull Request

on:
  pull_request:

permissions:
  contents: read

jobs:
  typescript_fast_checks:
    name: TypeScript Fast Checks
    uses: ./.github/workflows/typescript_fast_checks.yml

  go_fast_checks:
    name: Go Fast Checks
    uses: ./.github/workflows/go_fast_checks.yml

  docs_checks:
    name: Docs Checks
    uses: ./.github/workflows/docs_checks.yml
