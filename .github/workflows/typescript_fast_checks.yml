name: TypeScript Fast Checks

on:
  workflow_call:

jobs:
  fast-checks:
    name: Type Check and Unit Tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: parser-go/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run format:check

      - name: Check Linting
        run: npm run lint:ci

      - name: Check Types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run Unit Tests
        run: npm test
