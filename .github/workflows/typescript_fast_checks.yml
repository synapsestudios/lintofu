name: TypeScript Fast Checks

on:
  workflow_call:

jobs:
  fast-checks:
    name: Type Check and Unit Tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache Parser WASM
        id: wasm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/parser/lintofu-parser.wasm
          key: wasm-v1-${{ runner.os }}-${{ hashFiles('parser-go/**', 'scripts/build-wasm.sh') }}

      - name: Setup Go
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: parser-go/go.mod

      - name: Install Dependencies
        run: npm ci

      - name: Build Parser WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: npm run build:wasm

      - name: Check Formatting
        run: npm run format:check

      - name: Check Tested Versions
        run: npm run docs:versions:check

      - name: Check Linting
        run: npm run lint:ci

      - name: Check Types
        run: npm run typecheck

      - name: Build
        run: npm run build:js && npm run build:assets

      - name: Run Unit Tests
        run: npm run test:ci
