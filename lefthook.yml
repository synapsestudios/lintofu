pre-commit:
  parallel: true
  commands:
    # lefthook's `**` needs at least one intervening directory, so a file
    # sitting directly in scripts/ or docs/.vitepress/ needs its own pattern
    # alongside the recursive one.
    typescript-typecheck:
      glob: "{src/**/*.ts,scripts/*.ts,scripts/**/*.ts}"
      run: npm run typecheck

    typescript-lint:
      glob: "{src/**/*.ts,scripts/*.ts,scripts/**/*.ts}"
      run: npm run lint:ci

    # Wider than the other two: format:check also covers the vitepress config
    # and the .mjs scripts, which typecheck and lint do not.
    typescript-format:
      glob: "{src/**/*.ts,scripts/*.{mjs,ts},scripts/**/*.{mjs,ts},vitest.config.ts,docs/.vitepress/*.mts,docs/.vitepress/**/*.mts}"
      run: npm run format:check

    tested-versions-check:
      glob: "{README.md,provider-versions.json}"
      run: npm run docs:versions:check

    docs-rules-check:
      glob: "{src/rules/**/*.ts,docs/rules/*.md,scripts/render-rule-index.ts}"
      run: npm run docs:rules:check

    go-fmt-check:
      root: parser-go/
      glob: "*.go"
      run: make fmt-check

    go-lint:
      root: parser-go/
      glob: "*.go"
      run: make lint

pre-push:
  parallel: true
  commands:
    typescript-tests:
      run: npm test

    go-tests:
      root: parser-go/
      run: make test
