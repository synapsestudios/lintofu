pre-commit:
  parallel: true
  commands:
    typescript-typecheck:
      glob: "src/**/*.ts"
      run: npm run typecheck

    typescript-lint:
      glob: "src/**/*.ts"
      run: npm run lint:ci

    typescript-format:
      glob: "src/**/*.ts"
      run: npm run format:check

    tested-versions-check:
      glob: "{README.md,provider-versions.json}"
      run: npm run docs:versions:check

    docs-rules-check:
      glob: "{src/rules/**/*.ts,docs/rules/*.md,scripts/render-rule-index.ts}"
      run: npm run docs:rules:check

    go-fmt-check:
      root: parser-go/
      glob: "*.go"
      run: make fmt-check

    go-lint:
      root: parser-go/
      glob: "*.go"
      run: make lint

pre-push:
  parallel: true
  commands:
    typescript-tests:
      run: npm test

    go-tests:
      root: parser-go/
      run: make test
